<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeromagnetic Survey</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #0f172a; }
        #map { width: 100vw; height: 100vh; z-index: 1; }
        #contour-container { 
            display: none; 
            position: absolute; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 500; 
            background: #0f172a; 
        }
        .floating-controls { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1000; 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(10px); 
            padding: 15px 30px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.1); 
            display: flex; gap: 20px; 
            align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
    </style>
</head>
<body>
    <div class="floating-controls">
        <div style="display: flex; align-items: center; gap: 15px; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 20px;">
            <span id="survey-baseline-val" style="font-family: monospace; font-size: 1.1em; color: var(--cyan); white-space: nowrap; font-weight: 600; letter-spacing: 1px;">0.00 µT</span>
            <button style="border: none; cursor: pointer; padding: 8px 20px; font-size: 0.85em; font-weight: 700; letter-spacing: 1px; border-radius: 50px; background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.4); color: var(--cyan); white-space: nowrap; transition: all 0.3s; box-shadow: 0 0 10px rgba(14,165,233,0.2);" onclick="setMagneticBaseline()" onmouseover="this.style.background='var(--cyan)'; this.style.color='#fff';" onmouseout="this.style.background='rgba(14, 165, 233, 0.15)'; this.style.color='var(--cyan)';">
                SET BASELINE
            </button>
        </div>
        
        <div style="display: flex; align-items: center; gap: 12px; padding-right: 20px; border-right: 1px solid rgba(255,255,255,0.1);">
            <label class="toggle-switch" style="margin: 0; flex-shrink: 0; transform: scale(0.9);">
                <input type="checkbox" id="heatmap-toggle" onchange="toggleHeatmap()">
                <span class="slider round"></span>
            </label>
            <span style="font-size: 0.9em; color: #f8fafc; font-weight: 700; letter-spacing: 1px; white-space: nowrap;">AEROMAGNETIC SCANNER</span>
        </div>

        <div style="display: flex; align-items: center; padding-left: 5px; gap: 10px;">
            <button id="btn-generate-2d" style="border: none; cursor: pointer; padding: 8px 15px; font-size: 0.8em; font-weight: 700; letter-spacing: 1px; border-radius: 50px; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); color: var(--rose); white-space: nowrap; transition: all 0.3s;" onclick="generateMap('heatmap')" onmouseover="this.style.background='var(--rose)'; this.style.color='#fff';" onmouseout="this.style.background='rgba(244, 63, 94, 0.15)'; this.style.color='var(--rose)';">
                2D MAP
            </button>
            <button id="btn-generate-3d" style="border: none; cursor: pointer; padding: 8px 15px; font-size: 0.8em; font-weight: 700; letter-spacing: 1px; border-radius: 50px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: var(--emerald); white-space: nowrap; transition: all 0.3s;" onclick="generateMap('surface')" onmouseover="this.style.background='var(--emerald)'; this.style.color='#fff';" onmouseout="this.style.background='rgba(16, 185, 129, 0.15)'; this.style.color='var(--emerald)';">
                3D SURFACE
            </button>
            <button id="btn-close-map" style="display: none; border: none; cursor: pointer; padding: 8px 20px; font-size: 0.85em; font-weight: 700; letter-spacing: 1px; border-radius: 50px; background: rgba(148, 163, 184, 0.15); border: 1px solid rgba(148, 163, 184, 0.4); color: #cbd5e1; white-space: nowrap; transition: all 0.3s;" onclick="closeContourMap()" onmouseover="this.style.background='#94a3b8'; this.style.color='#0f172a';" onmouseout="this.style.background='rgba(148, 163, 184, 0.15)'; this.style.color='#cbd5e1';">
                BACK TO LIVE VIEW
            </button>
        </div>
    </div>
    
    <div id="survey-legend" style="display: none; position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); padding: 15px 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); flex-direction: column; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <div style="color: #cbd5e1; font-size: 0.8em; font-weight: 600; letter-spacing: 1px; text-align: center; margin-bottom: 5px;">MAGNETIC ANOMALY (µT DIFFERENCE)</div>
        <div style="width: 450px; height: 12px; border-radius: 6px; background: linear-gradient(to right, rgba(14, 165, 233, 0) 0%, rgb(14, 165, 233) 20%, rgb(132, 204, 22) 50%, rgb(234, 179, 8) 80%, rgb(239, 68, 68) 100%);"></div>
        <div style="display: flex; justify-content: space-between; color: #94a3b8; font-size: 0.75em; font-weight: 700; font-family: monospace; margin-top: 5px;">
            <div style="text-align: center; width: 20%;"><span>0</span><br><span style="font-size: 0.85em; color: #64748b; font-family: 'Outfit', sans-serif;">Normal Field</span></div>
            <div style="text-align: center; width: 20%;"><span>10</span><br><span style="font-size: 0.85em; color: #64748b; font-family: 'Outfit', sans-serif;">Trace Metals</span></div>
            <div style="text-align: center; width: 20%;"><span>25</span><br><span style="font-size: 0.85em; color: #64748b; font-family: 'Outfit', sans-serif;">Buried Pipe</span></div>
            <div style="text-align: center; width: 20%;"><span>40</span><br><span style="font-size: 0.85em; color: #64748b; font-family: 'Outfit', sans-serif;">Large Mass</span></div>
            <div style="text-align: right; width: 20%;"><span>50+</span><br><span style="font-size: 0.85em; color: #ef4444; font-family: 'Outfit', sans-serif;">Iron Ore / UXO</span></div>
        </div>
    </div>
    
    <div id="map"></div>
    <div id="contour-container">
        <div id="contour-plot" style="width: 100%; height: 100%;"></div>
    </div>
    <script src="survey.js"></script>
</body>
</html>
