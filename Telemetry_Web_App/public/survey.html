<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeromagnetic Survey</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #0f172a; }
        #map { width: 100vw; height: 100vh; }
        .floating-controls { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1000; 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(10px); 
            padding: 15px 30px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.1); 
            display: flex; gap: 20px; 
            align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
    </style>
</head>
<body>
    <div class="floating-controls">
        <div style="display: flex; align-items: center; gap: 15px; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 20px;">
            <span id="survey-baseline-val" style="font-family: monospace; font-size: 1.1em; color: var(--cyan); white-space: nowrap; font-weight: 600; letter-spacing: 1px;">0.00 µT</span>
            <button style="border: none; cursor: pointer; padding: 8px 20px; font-size: 0.85em; font-weight: 700; letter-spacing: 1px; border-radius: 50px; background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.4); color: var(--cyan); white-space: nowrap; transition: all 0.3s; box-shadow: 0 0 10px rgba(14,165,233,0.2);" onclick="setMagneticBaseline()" onmouseover="this.style.background='var(--cyan)'; this.style.color='#fff';" onmouseout="this.style.background='rgba(14, 165, 233, 0.15)'; this.style.color='var(--cyan)';">
                SET BASELINE
            </button>
        </div>
        
        <div style="display: flex; align-items: center; gap: 12px; padding-left: 5px;">
            <label class="toggle-switch" style="margin: 0; flex-shrink: 0; transform: scale(0.9);">
                <input type="checkbox" id="heatmap-toggle" onchange="toggleHeatmap()">
                <span class="slider round"></span>
            </label>
            <span style="font-size: 0.9em; color: #f8fafc; font-weight: 700; letter-spacing: 1px; white-space: nowrap;">AEROMAGNETIC SCANNER</span>
        </div>
    </div>
    <div id="map"></div>
    <script src="survey.js"></script>
</body>
</html>
